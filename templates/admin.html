<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
    <style> .hidden { display: none; } </style>
</head>
<body>
    <div class="container">
        <!-- (Login container is unchanged) -->
        <div id="login-container">
            <h1>Admin Login</h1>
            <form id="login-form">
                <label for="login-mis">MIS Number</label>
                <input type="text" id="login-mis" placeholder="e.g., 612515010" required>
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required>
                <button type="submit">Login</button>
                <p id="login-error" class="error"></p>
            </form>
        </div>

        <div id="admin-panel" class="hidden">
            <div class="header">
                <h1 id="panel-title">Notice Manager</h1> 
                <button id="logout-button">Logout</button>
            </div>
            <div class="admin-nav">
                <button id="nav-notices" class="nav-button active">Notice Manager</button>
                <button id="nav-classes" class="nav-button">Extra Class Manager</button>
            </div>
            
            <!-- (Notice panel is unchanged) -->
            <div id="notice-manager-panel">
                <form id="notice-form">
                    <h3>Add a New Notice</h3>
                    <label for="notice-message">Notice Message</label>
                    <textarea id="notice-message" rows="4" placeholder="Type your notice here..."></textarea>
                    <label for="notice-expiry">Expiry Date and Time</label>
                    <input type="datetime-local" id="notice-expiry" required>
                    <button type="submit">Add New Notice</button>
                    <p id="publish-status" class="status"></p>
                </form>
                <hr> 
                <div class="current-list-container">
                    <h3>Active Notices</h3>
                    <p id="no-notices-msg" class="hidden">No active notices.</p>
                    <div id="current-notices-list"></div>
                </div>
            </div>

            <!-- === EXTRA CLASS PANEL (UPDATED) === -->
            <div id="extra-class-panel" class="hidden">
                <form id="extra-class-form">
                    <h3>Schedule an Extra Class</h3>
                    
                    <label for="ec-subject">Subject</label>
                    <select id="ec-subject" required>
                        <option value="">Loading subjects...</option>
                    </select>

                    <label for="ec-division">Division</label>
                    <select id="ec-division" required>
                        <option value="">Select a subject first</option>
                    </select>

                    <label for="ec-date">Class Date</label>
                    <input type="date" id="ec-date" required>

                    <!-- === UPDATED: Time inputs are now dropdowns === -->
                    <label for="ec-start-time">Start Time</label>
                    <select id="ec-start-time" required>
                        <option value="">Select start time</option>
                    </select>

                    <label for="ec-end-time">End Time</label>
                    <select id="ec-end-time" required>
                        <option value="">Select end time</option>
                    </select>
                    <!-- === END OF UPDATE === -->

                    <label for="ec-room">Room (Optional)</label>
                    <input type="text" id="ec-room" placeholder="e.g., C-301">
                    
                    <button type="submit">Schedule Class</button>
                    <p id="ec-publish-status" class="status"></p>
                </form>
                <hr>
                <div class="current-list-container">
                    <h3>Scheduled Extra Classes</h3>
                    <p id="no-classes-msg" class="hidden">No extra classes scheduled.</p>
                    <div id="current-classes-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- (Firebase scripts are unchanged) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

</body>
